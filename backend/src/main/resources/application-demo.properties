# Optional local demo database. Start with: mvn spring-boot:run -Dspring-boot.run.profiles=demo
spring.datasource.url=jdbc:h2:file:./funews-demo;MODE=MSSQLServer;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
