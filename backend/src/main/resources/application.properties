spring.application.name=A2NguyenHungPhatDat_CE191354
server.port=8080

# Create the database first in SQL Server: CREATE DATABASE A2NguyenHungPhatDat_CE191354;
# Set DB_USERNAME and DB_PASSWORD for your local SQL Server login.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=A2NguyenHungPhatDat_CE191354;encrypt=true;trustServerCertificate=true}
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Spring Data JPA creates/updates the tables from the entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
